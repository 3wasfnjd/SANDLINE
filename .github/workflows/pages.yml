name: Build and deploy SANDLINE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sandline-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Use built assets for Pages
        uses: actions/github-script@v7
        with:
          script: |
            const site = await github.rest.repos.getPages(context.repo);
            if (site.data.build_type !== 'workflow') {
              await github.rest.repos.updateInformationAboutPagesSite({
                ...context.repo, build_type: 'workflow'
              });
            }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish built game
        id: deployment
        uses: actions/deploy-pages@v4
