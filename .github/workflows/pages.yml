name: Build and deploy SANDLINE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: sandline-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --import tsx tests/renderer-registration.ts
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the legacy Pages publisher when enabled
        uses: actions/github-script@v7
        with:
          script: |
            const site = await github.rest.repos.getPages(context.repo);
            if (site.data.build_type === 'workflow') return;
            // Existing branch-based Pages sites also run Jekyll. Publish our
            // built game last, without needing repository administration access.
            for (let attempt = 0; attempt < 30; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, per_page: 100
              });
              const legacy = data.workflow_runs.filter(run =>
                run.name === 'pages build and deployment');
              if (legacy.length && legacy.every(run => run.status === 'completed')) return;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Legacy Pages publishing has not finished; rerun this job after it completes.');
      - name: Publish built game
        id: deployment
        uses: actions/deploy-pages@v4
