 <title>خط الرمل · SANDLINE</title>
 <link rel="icon" type="image/svg+xml" href="/favicon.svg">
 <link rel="preload" as="image" href="/assets/night-battle-poster.webp" fetchpriority="high">
 <link rel="stylesheet" href="/src/briefing.css">
</head>
<body>
 <canvas id="battlefield" aria-label="ساحة معركة خط الرمل"></canvas>
 <div id="ui" hidden></div>
 <section id="loading-screen" aria-label="تجهيز معركة خط الرمل" style="--load:0%">
  <div class="war-poster" aria-hidden="true"></div><div class="war-shade" aria-hidden="true"></div>
  <header class="deployment-header"><span class="deployment-mark"><i></i> ABODEN GAMES</span><span class="operation-code">OP. 01 / WADI AL-SIDR</span></header>
  <div class="war-title"><p class="war-eyebrow">لا هدوء على خط المواجهة</p><h1>خط الرمل</h1><div class="war-wordmark" lang="en">SANDLINE</div><p class="war-subtitle">قُد فرقك. امتلك الأرض. احسم المعركة.</p></div>
  <div class="deployment-bottom">
   <div class="deployment-copy"><span class="briefing-label">نداء الجبهة</span><p id="loading-quote">في قلب العاصفة… يبدأ الحسم.</p></div>
   <div class="loading-meta"><span id="loading-stage" role="status">تجهيز الاتصال بساحة المعركة</span><b id="loading-percent">00%</b></div>
   <div id="loading-progress" class="war-progress" role="progressbar" aria-label="جاهزية ساحة المعركة" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
   <button id="deploy-button" disabled>تجهيز المعركة…</button>
   <p class="deployment-footnote">قيادة فرق <i></i> سيطرة على المواقع <i></i> لاعب ضد الذكاء الاصطناعي</p>
  </div>
  <noscript>فعّل JavaScript لتشغيل اللعبة.</noscript>
 </section>
 <script type="module" src="/src/entry.ts"></script>
